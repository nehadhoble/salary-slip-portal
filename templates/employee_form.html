{% extends "base.html" %}
{% block title %}{{ 'Edit' if employee else 'Add' }} Employee - Salary Slip Portal{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ 'Edit' if employee else 'Add' }} Employee</h1>
</div>

<form method="post" class="card form-card">
  <div class="form-row">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ employee.name if employee else '' }}" required>
  </div>
  <div class="form-row">
    <label for="employee_no">Employee number</label>
    <input type="text" id="employee_no" name="employee_no" value="{{ employee.employee_no if employee else '' }}">
  </div>
  <div class="form-row">
    <label for="designation">Designation</label>
    <input type="text" id="designation" name="designation" value="{{ employee.designation if employee else '' }}">
  </div>
  <div class="form-row">
    <label for="date_of_joining">Date of joining</label>
    <input type="text" id="date_of_joining" name="date_of_joining" placeholder="DD-MM-YYYY"
           value="{{ employee.date_of_joining if employee else '' }}">
  </div>
  <div class="form-row">
    <label for="pan">PAN</label>
    <input type="text" id="pan" name="pan" value="{{ employee.pan if employee else '' }}">
  </div>
  <div class="form-row">
    <label for="account_no">Bank account number</label>
    <input type="text" id="account_no" name="account_no" value="{{ employee.account_no if employee else '' }}">
  </div>
  <div class="form-row">
    <label for="ifsc_code">IFSC code</label>
    <input type="text" id="ifsc_code" name="ifsc_code" value="{{ employee.ifsc_code if employee else '' }}">
  </div>

  <div class="form-actions">
    <a class="btn btn-secondary" href="{{ url_for('employees') }}">Cancel</a>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
{% endblock %}
