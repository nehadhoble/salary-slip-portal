{% extends "base.html" %}
{% block title %}Login - Salary Slip Portal{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Salary Slip Portal</h1>
  <p class="muted">Enter the portal password to continue.</p>
  <form method="post">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus required>
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</div>
{% endblock %}
