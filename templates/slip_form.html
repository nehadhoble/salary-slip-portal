{% extends "base.html" %}
{% block title %}New Slip - Salary Slip Portal{% endblock %}
{% block content %}
<div class="page-header">
  <h1>New Slip</h1>
</div>

<form method="post" action="{{ url_for('slip_preview') }}" class="card form-card" id="slip-form">
  <div class="form-row">
    <label for="employee_select">Load from saved employee</label>
    <select id="employee_select">
      <option value="">— Enter manually —</option>
      {% for e in employees %}
      <option value="{{ e.id }}" {{ 'selected' if form.employee_id|string == e.id|string }}>{{ e.name }}</option>
      {% endfor %}
    </select>
  </div>
  <input type="hidden" name="employee_id" id="employee_id" value="{{ form.employee_id }}">

  <div class="form-row">
    <label for="company">Company</label>
    <select id="company" name="company">
      {% for c in companies %}
      <option value="{{ c }}" {{ 'selected' if form.company == c }}>{{ c }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-grid">
    <div class="form-row">
      <label for="month">Month</label>
      <select id="month" name="month">
        {% for m in months %}
        <option value="{{ m }}" {{ 'selected' if form.month == m }}>{{ m }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label for="year">Year</label>
      <select id="year" name="year">
        {% for y in years %}
        <option value="{{ y }}" {{ 'selected' if form.year|string == y|string }}>{{ y }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="form-row">
    <label for="employee_name">Employee name</label>
    <input type="text" id="employee_name" name="employee_name" value="{{ form.employee_name }}" required>
  </div>

  <div class="form-grid">
    <div class="form-row">
      <label for="employee_no">Employee number</label>
      <input type="text" id="employee_no" name="employee_no" value="{{ form.employee_no }}" readonly
             placeholder="Set on the employee record">
    </div>
    <div class="form-row">
      <label for="designation">Designation</label>
      <input type="text" id="designation" name="designation" value="{{ form.designation }}">
    </div>
    <div class="form-row">
      <label for="location">Location</label>
      <input type="text" id="location" name="location" value="{{ form.location }}">
    </div>
    <div class="form-row">
      <label for="bank_details">Bank details</label>
      <input type="text" id="bank_details" name="bank_details" value="{{ form.bank_details }}">
    </div>
    <div class="form-row">
      <label for="date_of_joining">Date of joining</label>
      <input type="text" id="date_of_joining" name="date_of_joining" placeholder="DD-MM-YYYY" value="{{ form.date_of_joining }}">
    </div>
    <div class="form-row">
      <label for="tax_regime">Tax regime</label>
      <select id="tax_regime" name="tax_regime">
        {% for t in tax_regimes %}
        <option value="{{ t }}" {{ 'selected' if form.tax_regime == t }}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label for="pan">Income Tax Number (PAN)</label>
      <input type="text" id="pan" name="pan" value="{{ form.pan }}">
    </div>
    <div class="form-row">
      <label for="uan">Universal Account Number (UAN)</label>
      <input type="text" id="uan" name="uan" value="{{ form.uan }}">
    </div>
    <div class="form-row">
      <label for="pf_account_number">PF account number</label>
      <input type="text" id="pf_account_number" name="pf_account_number" value="{{ form.pf_account_number }}">
    </div>
    <div class="form-row">
      <label for="esi_number">ESI Number</label>
      <input type="text" id="esi_number" name="esi_number" value="{{ form.esi_number }}">
    </div>
    <div class="form-row">
      <label for="pran">PR Account Number (PRAN)</label>
      <input type="text" id="pran" name="pran" value="{{ form.pran }}">
    </div>
  </div>

  <div class="form-grid">
    <div class="form-row">
      <label for="total_earnings">Total Earnings</label>
      <input type="number" step="0.01" min="0" id="total_earnings" name="total_earnings" value="{{ form.total_earnings }}" required>
    </div>
    <div class="form-row">
      <label for="deduction">Deduction</label>
      <input type="number" step="0.01" min="0" id="deduction" name="deduction" value="{{ form.deduction }}">
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Preview slip</button>
  </div>
</form>

<script>
  const EMPLOYEES_URL_TEMPLATE = "{{ url_for('api_employee', employee_id=0) }}";
  const employeeSelect = document.getElementById("employee_select");
  const employeeIdField = document.getElementById("employee_id");

  employeeSelect.addEventListener("change", async function () {
    const id = employeeSelect.value;
    employeeIdField.value = id;
    if (!id) return;
    const res = await fetch(EMPLOYEES_URL_TEMPLATE.replace(/0$/, id));
    if (!res.ok) return;
    const e = await res.json();
    document.getElementById("employee_name").value = e.name || "";
    document.getElementById("employee_no").value = e.employee_no || "";
    document.getElementById("designation").value = e.designation || "";
    document.getElementById("date_of_joining").value = e.date_of_joining || "";
    document.getElementById("pan").value = e.pan || "";
    document.getElementById("bank_details").value = e.bank_details_summary || "";
  });
</script>
{% endblock %}
